ail:`Не удалось сохранить данные: браузер запретил запись.`,readFail:`Не удалось прочитать файл.`,tipAria:`Подсказка`,diagramZone:e=>`Зона контроля ${e} м`,diagramFrame:e=>`Кадр ${e} м`,diagramTilt:e=>`Наклон ${e}°`,diagramLength:e=>`${e} м`,diagramOffset:e=>`Вынос ${e} м`,diagramDepth:e=>`Глубина зоны ${e} м`,diagramOverCenter:`Камера над центром зоны`,diagramOverZone:`Камера над зоной`,diagramCameraHeight:e=>`H ${e} м`,diagramPlaneHeight:e=>`h ${e} м`,diagramAria:e=>`Вид сбоку: камера на высоте ${e.H} м, наклон ${e.tilt}°, VFOV ${e.vfov}°, зона от ${e.x1} до ${e.x2} м на высоте ${e.h} м`+(e.frameWidthNear?`, ширина кадра ${e.frameWidthNear}–${e.frameWidthFar} м`:``),tips:{typeName:`Название типа камеры, например «Рабочее место» или «Тележка». Тип — группа одинаковых камер с одной задачей: общие геометрия, матрица, поток и объекты.`,typeCount:`Количество камер этого типа в системе. Влияет на сетевой поток, декодирование и нагрузку на GPU, но не на пиксели на объекте.`,camera:`Камера из «Шаблонов»: разрешение и матрица берутся из неё, а требуемое фокусное расстояние проверяется по диапазону её объектива. «Ручная настройка матрицы» — разрешение и матрица задаются вручную.`,gpuFormTflops:`FP16 Tensor из даташита NVIDIA без sparsity. Если значение отмечено звёздочкой «with sparsity», разделите его на 2. Для GeForce используйте FP16 с FP32-накоплением: оно вдвое меньше FP16-накопления.`,gpuFormArchitecture:`Архитектура задаёт производительность одного аппаратного декодера NVDEC. Для Jetson выберите «Jetson или свой декодер» и укажите число потоков 1080p30 из спецификации.`,detectorFormFps:`Число кадров в секунду, которое модель обрабатывает на одном GPU в TensorRT с той же точностью и batch, что и в эксплуатации.`,cameraFormSensorWidth:`Ширина активной области сенсора из даташита. Если её нет, оставьте поле пустым и укажите размер пикселя.`,cameraHeight:`Высота объектива над полом. Измерьте лазерным дальномером от пола до точки крепления. Чем выше камера, тем меньше перекрытий объектов, но ниже плотность пикселей.`,planeHeight:`Высота поверхности, на которой находятся объекты контроля: столешница ≈ 0,85–0,9\xA0м, верх ложемента тележки. Для рук работника — ≈ 1,0–1,2\xA0м. Весь расчёт выполняется для этой плоскости.`,placement:`Сбоку — камера направлена под углом, видны и человек, и объекты. Над центром — камера направлена строго вниз: лучший вид на ячейки тележки, но человек виден сверху и действия рук различаются хуже.`,zoneStart:`Расстояние по полу от точки под камерой до ближнего края зоны. Отрицательное значение — камера находится над частью зоны.`,zoneDepth:`Размер зоны вдоль направления взгляда камеры, от ближнего края до дальнего.`,zoneWidth:`Размер зоны поперёк направления взгляда камеры.`,orientation:`Камеру можно повернуть на 90°, чтобы длинная сторона кадра совпала с длинной стороной зоны. «Авто» выбирает вариант, при котором на метр зоны приходится больше пикселей. Поворот поддерживают многие корпусные камеры (режим «коридор»). Для купольных камер проверьте возможность поворота модуля.`,margin:`Запас, чтобы зона не доходила до краёв кадра: там ниже резкость и сильнее дисторсия, а при монтаже камера может сместиться. Типичное значение — 10–20%.`,resolution:`Разрешение потока, который обрабатывает аналитика. Если модель получает субпоток, укажите разрешение субпотока.`,sensor:`Дюймовый формат матрицы условный, у разных производителей размеры отличаются. Точнее всего — режим «По размеру пикселя» с данными из даташита сенсора.`,sensorWidth:`Ширина области матрицы, которая формирует видео в выбранном разрешении. В даташите сенсора — effective или active area.`,pixelPitch:`Размер пикселя из даташита сенсора (pixel size, мкм), например 2,0\xA0мкм у IMX334. Ширина матрицы = размер пикселя × число пикселей по горизонтали.`,lensMode:`«Подбор» — калькулятор подбирает угол обзора под зону. «Фокусное расстояние» или «Угол HFOV» — проверка конкретной камеры из каталога.`,focalLength:`Фокусное расстояние объектива из даташита камеры. Для вариофокального объектива проверьте оба конца диапазона.`,hfov:`Горизонтальный угол обзора из даташита. Не путайте его с диагональным (DFOV): диагональный больше и часто указан крупнее.`,objects:`Карточка для каждого объекта: габариты (ширина поперёк взгляда камеры, длина вдоль, высота), модель, которая его обнаруживает, подача кадра в модель, размер входа и порог в пикселях на меньшую сторону объекта. Результат отображается в карточке. Объекты с одной моделью и одной подачей считаются одним запуском: нагрузка не удваивается.`,lensFactor:`Доля номинального разрешения, которая доходит до модели после сжатия, оптики и дисторсии. 0,7 — качественная камера с высоким битрейтом, 0,6 — типичное значение, 0,5 — широкоугольный объектив или вид сверху.`,speed:`Скорость самого быстрого движения, которое должно быть видно без смаза: руки при работе ≈ 1\xA0м/с, идущий человек ≈ 1,5\xA0м/с.`,blurPx:`Допустимый смаз в пикселях. Для детекции — 1–2\xA0px, для чтения маркировки — не больше 0,5–1\xA0px.`,fps:`Частота кадров потока для аналитики. Для фиксации событий с точностью ≈ 1\xA0с достаточно 5–10\xA0кадр/с, для отслеживания действий рук — 10–15\xA0кадр/с.`,codec:`H.265 даёт примерно вдвое меньший поток при том же качестве. H.264 используйте, если декодер сервера не поддерживает H.265.`,scene:`Битрейт растёт с движением в кадре. Спокойная сцена — пустой склад, обычная — рабочее место, активная — проходы с большим числом людей и техники.`,analyticsFps:`Число кадров в секунду с каждой камеры, которое проходит через модели. Присутствие человека — 2–5\xA0кадр/с, учёт деталей и такта — 5–10\xA0кадр/с. Не больше частоты кадров потока.`,efficiency:`Доля замеренной скорости, которая сохраняется в реальной системе с учётом декодирования, пред- и постобработки, трекинга, записи в БД и пиков нагрузки. 0,7 — отлаженный DeepStream/TensorRT, 0,5–0,6 — типичное значение, 0,4 — Python-пайплайн без оптимизации.`,gpu:`«Авто» перебирает все отмеченные GPU в количестве от 1 до 4 и выбирает самую дешёвую конфигурацию, которая выдерживает нагрузку с запасом и помещается в видеопамять. Список GPU, цены и свои GPU — в «Шаблонах».`,gpuCount:`Количество GPU. «Авто» — минимальное количество, которое выдерживает нагрузку. Два недорогих GPU часто выгоднее одного дорогого.`,reserve:`Доля мощности, которая остаётся свободной под рост: новые камеры, вторая модель, пики нагрузки. При 20% загрузка инференса и декодера не превышает ≈ 83%.`,archiveDays:`Сколько дней хранить видео. 0 — видео не записывается, хранятся только события аналитики.`}},p={docTitle:`Camera calculator`,appTitle:`Camera and compute calculator`,themeLight:`Light theme`,themeDark:`Dark theme`,langBtn:`RU`,langAria:`Русский`,templatesBtn:`Templates`,resetBtn:`Load example`,copyBtn:`Copy report`,tabsAria:`Camera types`,loadTitle:`GPU load`,addGpuLink:`+ Custom GPU`,gpu:`GPU`,gpuCount:`Count`,auto:`Auto`,gpuAuto:`Auto: lowest price`,gpuCustomMark:` (custom)`,donutAria:`Inference load`,donutCaption:`inference`,donutAriaValue:(e,t)=>`Inference load ${e}, threshold ${t}`,bottleneckInference:`inference`,bottleneckDecoder:`decoding`,bottleneckMemory:`GPU memory`,optimum:`best price`,manual:`manual selection`,insufficient:`insufficient`,headroom:e=>`headroom ${e}`,bottleneck:e=>`bottleneck: ${e}`,otherRuns:e=>`Other inference runs: ${e}`,free:`Free`,freeSubtitle:e=>`Threshold ${e} is marked on the ring`,noLoad:`Add cameras and objects with models.`,gaugeDecoder:`Decoder`,gaugeMemory:`GPU memory`,gaugeDecoderSubtitle:(e,t)=>`${e} of ${t} streams`,gaugeMemorySubtitle:(e,t)=>`${e} of ${t} GB`,noCandidates:`No GPU is selected for auto-selection. Select GPUs in "Templates".`,systemInputError:`Unable to select a GPU: a system setting or a GPU price has an invalid value. Check the derating factor, growth headroom, archive retention, and prices in "Templates".`,noFit:`No GPU can handle the load, even 4 of them. Lower the analytics frame rate, use zone crop instead of tiles, choose a lighter model, or split the camera
