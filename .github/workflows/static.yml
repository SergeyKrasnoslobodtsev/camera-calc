# Сборка страницы и публикация на GitHub Pages при слиянии в main
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  # запуск вручную со вкладки Actions
  workflow_dispatch:

# права GITHUB_TOKEN для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# одна публикация за раз; начатая публикация не отменяется
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
